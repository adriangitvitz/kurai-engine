services:
  cloudflared:
    image: cloudflare/cloudflared:latest
    command: proxy-dns --address 0.0.0.0 --port 53 --upstream https://1.1.1.1/dns-query
    restart: unless-stopped
    profiles:
      - doh
    networks:
      kurai-net:
        ipv4_address: 172.20.0.100
    deploy:
      resources:
        limits:
          memory: 64M
        reservations:
          memory: 32M

  web:
    build: ./web
    ports:
      - "3000:3000"
    environment:
      - KURAI_BACKEND_URL=http://kurai:8080
      - NEXT_PUBLIC_AUTH_ENABLED=${KURAI_AUTH_ENABLED:-false}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-anthropic/claude-sonnet-5}
      - OPENROUTER_MODEL_FAST=${OPENROUTER_MODEL_FAST:-anthropic/claude-haiku-4.5}
    depends_on:
      kurai:
        condition: service_healthy
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 1.1.1.1
    networks:
      - kurai-net
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  kurai:
    build: .
    ports:
      - "8080:8080"
    environment:
      - KURAI_SEARXNG_URL=http://searxng:8080
      - KURAI_PORT=8080
      - KURAI_LOG_LEVEL=${KURAI_LOG_LEVEL:-info}
      - KURAI_DOH_ENABLED=false
      - KURAI_BLOCKLIST_CACHE_PATH=/app/cache/blocklists
      - KURAI_AUTH_ENABLED=${KURAI_AUTH_ENABLED:-false}
      - KURAI_AUTH_SECRET=${KURAI_AUTH_SECRET:-}
      - KURAI_AUTH_USERS_FILE=/app/users.yaml
      - KURAI_COOKIE_SECURE=false
      - KURAI_TAVILY_ENABLED=${KURAI_TAVILY_ENABLED:-false}
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
      - KURAI_PROBE_ENABLED=${KURAI_PROBE_ENABLED:-}
      - KURAI_PROBE_DROP_UNREACHABLE=${KURAI_PROBE_DROP_UNREACHABLE:-}
    volumes:
      - ./blocklists:/app/blocklists:ro
      - ./config.yaml:/app/config.yaml:ro
      - blocklist-cache:/app/cache/blocklists
      - bookmark-data:/app/data
      - ./users.yaml:/app/users.yaml:ro
    depends_on:
      searxng:
        condition: service_healthy
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 1.1.1.1
    networks:
      - kurai-net
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

  tei:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-latest
    command: ["--model-id", "BAAI/bge-reranker-v2-m3"]
    ports:
      - "8082:80"
    profiles:
      - reranker
    networks:
      - kurai-net
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M

  searxng:
    build: ./searxng
    platform: linux/amd64
    ports:
      - "8888:8080"
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    environment:
      - SEARXNG_BASE_URL=http://localhost:8888/
      - SEARXNG_SECRET=${SEARXNG_SECRET:?SEARXNG_SECRET is not set. Run `make setup` first.}
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 1.1.1.1
    networks:
      - kurai-net
    healthcheck:
      test:
        [
          "CMD",
          "sh",
          "-c",
          "wget -q --spider http://localhost:8080/healthz && /usr/local/searxng/.venv/bin/python3 /usr/local/searxng/check_data_cache.py",
        ]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 30s
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

volumes:
  blocklist-cache:
    driver: local
  bookmark-data:
    driver: local

networks:
  kurai-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24

use_default_settings: true

general:
  debug: false
  instance_name: "Kurai SearXNG"

search:
  safe_search: 0
  autocomplete: ''
  formats:
    - html
    - json
  default_timeout: 5.0
  max_request_timeout: 8.0

server:
  secret_key: "set-by-SEARXNG_SECRET"
  limiter: false
  image_proxy: false
  method: "GET"

outgoing:
  request_timeout: 6.0
  max_request_timeout: 10.0
  pool_connections: 30
  pool_maxsize: 10
  enable_http2: true
  retries: 1
  retry_on_http_error: false

valkey:
  url: false

